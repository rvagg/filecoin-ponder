name: Release

# Publishes @rvagg/ponder to npm using OIDC (Trusted Publishing).
# No NPM_TOKEN secret needed; npm validates the GitHub OIDC token instead.
# Set up trusted publishing for the package on npmjs.com first:
#   npmjs.com -> @rvagg/ponder -> Settings -> Trusted Publishers
#   Repository: rvagg/filecoin-ponder
#   Workflow: .github/workflows/release.yml
#
# Triggers:
#   - workflow_dispatch: manual run, optionally publish under an npm dist-tag
#     (e.g. "next") to keep "latest" untouched. Useful for smoke testing.
#   - push of a v* tag (e.g. v0.16.7): publishes whatever version is in
#     packages/core/package.json under the "latest" dist-tag.
#
# Workflow expects packages/core/package.json's "version" field to already
# match upstream ponder's release. This is the natural state after a clean
# rebase on upstream/main.

on:
  workflow_dispatch:
    inputs:
      dist-tag:
        description: 'npm dist-tag to publish under (default: latest)'
        required: false
        default: 'latest'
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build packages
        run: pnpm --filter '@rvagg/ponder...' build

      - name: Determine dist-tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.dist-tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish @rvagg/ponder
        working-directory: packages/core
        run: pnpm publish --access public --provenance --no-git-checks --tag ${{ steps.tag.outputs.value }}
